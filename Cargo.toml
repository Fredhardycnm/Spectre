[package]
name = "spectre"
version = "0.1.0"
edition = "2021"
description = "授权范围内的红队样本沙箱信息采集与加密外带工具"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
data-encoding = "2"
chacha20poly1305 = "0.10"
flate2 = "1"
rand = "0.8"
dns-lookup = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = false
debug = false
debug-assertions = false
incremental = false
rpath = false

# 进一步减小体积（去掉 panic 展开、pdb 等）
[profile.release.package."*"]
opt-level = "z"
